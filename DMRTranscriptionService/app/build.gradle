plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macdmr.transcription'
    compileSdk 34

    defaultConfig {
        applicationId "com.macdmr.transcription"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Read API key from local.properties (gitignored)
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        def apiKey = localProperties.getProperty('GOOGLE_CLOUD_API_KEY', 'YOUR_API_KEY_HERE')
        buildConfigField "String", "GOOGLE_CLOUD_API_KEY", "\"${apiKey}\""
    }

    // Same keystore as DMRModHooks so one release key covers both APKs (never change: reinstall would need an uninstall)
    signingConfigs {
        release {
            storeFile file('../../DMRModHooks/release.keystore')
            storePassword 'android'
            keyAlias 'dmrmodhooks'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release   // same key for debug builds: adb install -r keeps working across debug/release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    
    // HTTP client for Google Cloud API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // On-device speech recognition (Vosk / Kaldi) for live captions — runs here, not in the module,
    // because JNA cannot be loaded inside the LSPosed-isolated radio-app process (see TRANSCRIBING_PLAN.md)
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
