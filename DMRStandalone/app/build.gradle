plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macdmr.radio'
    compileSdk 34

    defaultConfig {
        applicationId "com.macdmr.radio"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0-spike"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    // Unlocks the vendor audio class android.os.PrizeTinyService (hidden API) at runtime
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    // Compile-time stubs of the vendor framework classes; the real ones live in the boot class path
    compileOnly project(':tiny-stubs')
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
