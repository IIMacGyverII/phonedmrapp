plugins {
    id 'com.android.library'
}

// Compile-only stubs for Ulefone/Prize vendor framework classes (android.os.PrizeTinyService & friends).
// Never packaged into the APK: the app declares this module as compileOnly and the device's framework.jar
// provides the real implementations at runtime.
android {
    namespace 'com.macdmr.tinystubs'
    compileSdk 34
    defaultConfig { minSdk 29 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
