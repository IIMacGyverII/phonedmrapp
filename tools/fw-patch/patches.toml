frame: 108 symbols of the 0x77 preamble, the 192-symbol LSF, 6 symbols of
filter tail, and two zero samples. The research modem's bench callsign is
the source and the destination. Samples are 16-bit. The sign is flipped
from the R4a air result, -0.54 Hz per count, so symbol +3 aims at +2400 Hz.
The preamble overshoot sets the peak count at 6451. At 0.55 Hz per count the
linear prediction is 3548 Hz, under the stop. Tag R4b0. Still no +0x3074,
no +0x3EDFC, and bit 4 stays clear. The buffer loops every 64 ms, so this
is one frame per loop, not a stream. The 0x3D command is not in this image."""
