# R3-0. The IRAM copy (file +0x39408..+0x5AEFC) has no log string. The ASCII names in it
# (TMSG TRES TSUS QUEU FLAG TSIG SEMA TICK NONE) are uC/OS-III type words: the boot path
# compares or stores them, so changing one is not a harmless test. Tag R300 changed TICK
# at +0x3ACEB and the module did not banner. This patch changes the alignment halfword
# after FM key-up's jmp r15 (+0x3EE14) and before the literal pool at +0x3EE18. Nothing
# loads +0x3EE16. Not stacked with the key-up hook.
[patches.c7000-iram-padbyte]
why = """R3-0. One padding byte at +0x3EE16 (00 -> 58) inside the IRAM copy, after the
key-up function returns and before its pool. No instruction and no compared immediate.
The tag is the only other difference from the factory image. Boot test: banner and 0x34,
no transmission. A banner means the copied block has no whole-image check."""
measured_by = "R3-0: load, read the boot banner and the 0x34 tag, do not key"
status = "experimental"
sites = [
  { offset = 0x3EE16, original = "00", replacement = "58", note = "padding after FM key-up jmp r15, before the pool at +0x3EE18" },
]
