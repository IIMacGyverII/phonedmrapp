# R4d. The key returns at once. The service-task wake refills TX RAM.
# Tag R4d0. Stub at +0x5B000 (432 B). Table at +0x5B400 (4860 B). on_key at +0x5B0D0. on_unkey at +0x5B168.
[patches.c7000-txram-m17-wake]
why = """R4d. Same four 0x26 launch sites as R4c. on_key copies the first 512
samples into both TX-RAM halves, keys, stores the next-sample cursor at
IRAM 0x4DAAC, sets mask bit 15, and returns. The cursor is 0 at boot, so
the wake does not copy. on_wake_disp replaces the bsr at +0x18B5C.
on_wake_skip replaces the bsr at +0x18B68, whose factory target is jmp r15.
A clear cursor writes neither TX RAM, PTT, nor the mask. While the cursor
is set, a wake whose saved word has bit 15 copies 256 samples into the half
FM_ADDR_SW names. The task entry +0x18A70 is not patched. The table is the
R4c stream, peak count 6451. Still no +0x3074, no +0x3EDFC, and bit 4 stays
clear."""
