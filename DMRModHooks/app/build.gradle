plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dmrmod.hooks'
    compileSdk 34

    defaultConfig {
        applicationId "com.dmrmod.hooks"
        minSdk 26
        targetSdk 34
        versionCode 414
        versionName "4.1.4"

        // App label / LSPosed description follow versionName (backlog R11: strings.xml said "v0.2")
        resValue "string", "app_name", "DMR Mod Hooks v${versionName}"
        resValue "string", "xposed_description", "MacGyver DMR Modifications v${versionName}"

        // NDK configuration for Dire Wolf decoder - DISABLED, using pure Java PLL implementation
        /*
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        */
    }
    
    /*
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    */

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'android'
            keyAlias 'dmrmodhooks'
            keyPassword 'android'
        }
        debug {
            // ⚠️ CRITICAL: MUST use same keystore as release!
            // Changing this will cause signature mismatch on install,
            // forcing user to uninstall and re-enable module in LSPosed.
            // Always use install.ps1 script which preserves module state.
            storeFile file('../release.keystore')
            storePassword 'android'
            keyAlias 'dmrmodhooks'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    androidResources {
        noCompress += ['resources.arsc']
    }
    
    buildFeatures {
        aidl = true
        buildConfig = true   // exposes BuildConfig.VERSION_CODE (used to detect a pending-reboot update)
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    // LSPosed API
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // Host-side unit tests (Nearby Repeaters: pure parsers and geo math).
    // org.json is provided by android.jar at runtime; this artifact gives the same
    // API on the JVM test classpath so BrandMeisterSource.parse* is testable off-device.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
